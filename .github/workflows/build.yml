name: Build OpenGamesAutoPlay

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "requirements.txt failed, installing common libs"
          pip install ttkbootstrap mido pygame keyboard pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=icon.ico --name OpenGamesAutoPlay main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGamesAutoPlay.exe
          path: dist/OpenGamesAutoPlay.exe
